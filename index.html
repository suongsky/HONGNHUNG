<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Suong Tran | Oceanography</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Montserrat', sans-serif;
    }

    body {
      overflow: hidden;
      height: 100vh;
      background: linear-gradient(180deg, #021024, #04315e, #0b6fa4);
      color: #ffffff;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
    }

    .content {
      position: relative;
      z-index: 2;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: 1px;
    }

    h2 {
      margin-top: 12px;
      font-weight: 300;
      font-size: 1.2rem;
      opacity: 0.9;
    }

    .btn {
      margin-top: 40px;
      padding: 14px 36px;
      border-radius: 50px;
      border: 2px solid #7ddcff;
      color: #7ddcff;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.3s ease;
      backdrop-filter: blur(6px);
    }

    .btn:hover {
      background: #7ddcff;
      color: #021024;
      transform: translateY(-3px);
      box-shadow: 0 0 20px rgba(125,220,255,0.6);
    }

    /* --- Toạ độ biển Cồn Nhàn --- */
    .coords {
      margin-top: 22px;
      font-size: 0.78rem;
      letter-spacing: 0.5px;
      opacity: 0.65;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .coords svg {
      width: 14px;
      height: 14px;
      opacity: 0.8;
    }

    /* --- San hô (đáy biển) --- */
    .reef {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* --- Cua --- */
    .crab {
      position: absolute;
      bottom: 18px;
      z-index: 3;
      width: 46px;
      transform-origin: center;
      animation: scuttle 14s linear infinite;
    }

    @keyframes scuttle {
      0%   { left: -60px; transform: scaleX(1) translateY(0); }
      48%  { transform: scaleX(1) translateY(-4px); }
      50%  { left: calc(50% - 23px); transform: scaleX(-1) translateY(0); }
      98%  { transform: scaleX(-1) translateY(-4px); }
      100% { left: calc(100% + 60px); transform: scaleX(-1) translateY(0); }
    }

    footer {
      position: absolute;
      bottom: 20px;
      font-size: 0.8rem;
      opacity: 0.6;
      z-index: 2;
    }
  </style>
</head>
<body>

<!-- Canvas: bong bóng + sinh vật phù du -->
<canvas id="water"></canvas>

<!-- San hô đáy biển -->
<svg class="reef" viewBox="0 0 1200 160" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <!-- nền cát -->
  <path d="M0,160 L0,120 Q150,100 300,120 T600,115 T900,125 T1200,110 L1200,160 Z" fill="#04203f"/>

  <!-- cụm san hô nhánh (bên trái) -->
  <g fill="#ff8a7a" opacity="0.85">
    <path d="M60,150 C50,120 65,95 55,70 C68,90 75,60 85,75 C90,95 78,110 90,130 C78,135 70,150 60,150 Z"/>
    <path d="M110,150 C105,130 118,110 112,90 C122,105 128,85 135,95 C138,112 128,122 134,140 C124,145 118,150 110,150 Z"/>
  </g>

  <!-- san hô hình quạt -->
  <g fill="#ffd36e" opacity="0.8">
    <path d="M220,150 C200,120 205,80 235,60 C250,85 250,60 270,75 C280,105 260,120 260,150 Z"/>
  </g>

  <!-- san hô nấm (bên phải) -->
  <g fill="#7ddcff" opacity="0.75">
    <ellipse cx="980" cy="128" rx="26" ry="12"/>
    <rect x="972" y="128" width="16" height="20" rx="6"/>
    <ellipse cx="1030" cy="135" rx="18" ry="9"/>
    <rect x="1024" y="135" width="12" height="15" rx="5"/>
  </g>

  <!-- san hô nhánh (bên phải) -->
  <g fill="#ff8a7a" opacity="0.85">
    <path d="M1120,150 C1108,125 1120,105 1112,80 C1125,98 1132,75 1140,88 C1145,108 1132,118 1140,140 C1130,146 1126,150 1120,150 Z"/>
  </g>

  <!-- rong biển lay động -->
  <g stroke="#2fae8f" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.7">
    <path id="weed1" d="M400,150 C395,120 415,110 405,80"/>
    <path id="weed2" d="M430,150 C435,125 415,115 425,85"/>
    <path id="weed3" d="M850,150 C845,120 865,110 855,80"/>
  </g>
</svg>

<!-- Cua bò ngang đáy biển -->
<svg class="crab" viewBox="0 0 100 70" xmlns="http://www.w3.org/2000/svg">
  <g fill="#ff5a4e">
    <ellipse cx="50" cy="40" rx="26" ry="17"/>
    <!-- càng -->
    <path d="M24,32 C10,24 4,10 10,4 C16,14 22,20 30,26 Z"/>
    <path d="M76,32 C90,24 96,10 90,4 C84,14 78,20 70,26 Z"/>
    <!-- mắt -->
    <circle cx="40" cy="24" r="4" fill="#ff5a4e"/>
    <circle cx="60" cy="24" r="4" fill="#ff5a4e"/>
    <circle cx="40" cy="23" r="1.6" fill="#021024"/>
    <circle cx="60" cy="23" r="1.6" fill="#021024"/>
  </g>
  <!-- chân -->
  <g stroke="#ff5a4e" stroke-width="3" stroke-linecap="round">
    <path d="M28,48 L12,58"/>
    <path d="M30,54 L16,66"/>
    <path d="M34,58 L22,70"/>
    <path d="M72,48 L88,58"/>
    <path d="M70,54 L84,66"/>
    <path d="M66,58 L78,70"/>
  </g>
</svg>

<div class="content">
  <h1>Suong Tran</h1>
  <h2>Oceanography Student · A Soul Belonging to the Sea</h2>

  <a class="btn" href="https://sites.google.com/view/suongtran-ocean" target="_blank">
    Enter My Ocean
  </a>

  <div class="coords">
    <svg viewBox="0 0 24 24" fill="none" stroke="#7ddcff" stroke-width="2">
      <path d="M12 22s7-7.58 7-13A7 7 0 0 0 5 9c0 5.42 7 13 7 13z"/>
      <circle cx="12" cy="9" r="2.4"/>
    </svg>
    Biển Cồn Nhàn · Bảo Thuận, Ba Tri, Bến Tre — 10.0500°N, 106.6800°E
  </div>

  <footer>
    © 2026 · Inspired by the Ocean
  </footer>
</div>

<script>
  const canvas = document.getElementById("water");
  const ctx = canvas.getContext("2d");

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const bubbles = [];
  const bubbleCount = 90;

  const plankton = [];
  const planktonCount = 60;

  class Bubble {
    constructor() {
      this.reset(true);
    }
    reset(initial) {
      this.x = Math.random() * canvas.width;
      this.y = initial ? Math.random() * canvas.height : canvas.height + 10;
      this.radius = Math.random() * 2 + 1;
      this.speedY = Math.random() * 0.6 + 0.3;
      this.alpha = Math.random() * 0.5 + 0.3;
    }
    update() {
      this.y -= this.speedY;
      if (this.y < -10) this.reset(false);
    }
    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(180,220,255,${this.alpha})`;
      ctx.fill();
    }
  }

  // Sinh vật phù du: các chấm nhỏ li ti, trôi lững lờ, nhấp nháy nhẹ
  class Plankton {
    constructor() {
      this.reset();
      this.y = Math.random() * canvas.height;
    }
    reset() {
      this.x = Math.random() * canvas.width;
      this.y = Math.random() * canvas.height;
      this.radius = Math.random() * 1.2 + 0.4;
      this.driftX = (Math.random() - 0.5) * 0.15;
      this.driftY = (Math.random() - 0.5) * 0.15;
      this.baseAlpha = Math.random() * 0.4 + 0.2;
      this.twinklePhase = Math.random() * Math.PI * 2;
      this.twinkleSpeed = Math.random() * 0.02 + 0.01;
      this.hue = Math.random() > 0.5 ? "150,255,220" : "200,240,255";
    }
    update() {
      this.x += this.driftX;
      this.y += this.driftY;
      this.twinklePhase += this.twinkleSpeed;
      if (this.x < -5 || this.x > canvas.width + 5 || this.y < -5 || this.y > canvas.height + 5) {
        this.reset();
      }
    }
    draw() {
      const alpha = this.baseAlpha * (0.5 + 0.5 * Math.sin(this.twinklePhase));
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${this.hue},${alpha})`;
      ctx.fill();
    }
  }

  function init() {
    for (let i = 0; i < bubbleCount; i++) bubbles.push(new Bubble());
    for (let i = 0; i < planktonCount; i++) plankton.push(new Plankton());
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    plankton.forEach(p => { p.update(); p.draw(); });
    bubbles.forEach(b => { b.update(); b.draw(); });
    requestAnimationFrame(animate);
  }

  window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  });

  init();
  animate();
</script>

</body>
</html>
